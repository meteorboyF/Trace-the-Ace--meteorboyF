# Trace the Ace — base configuration.
# Everything tunable and every "magic number" lives here, never hardcoded in code.
# Task-specific overrides live in conf/experiments/*.yaml and are merged over this.

seed: 1234

# --- Cross-validation ---------------------------------------------------------
# Folds group by session_id (NEVER response_id). See docs/BRIEF.md §10.
cv:
  n_splits: 5
  strategy: stratified_group   # StratifiedGroupKFold(groups=session_id, y=correct)
  group_col: session_id
  label_col: correct

# --- Label handling -----------------------------------------------------------
# Log loss blows up at exactly 0/1. Clip predictions into [eps, 1-eps].
predict_clip_eps: 1.0e-6

# --- Compute budget -----------------------------------------------------------
# VERIFY these against Colab's live Resources panel and update here — never hardcode
# unit rates in code. Units burn while the runtime is CONNECTED, not while computing.
budget:
  total_units: 733
  # approx compute units per hour by tier (Colab Pro+, verify live)
  unit_rates:
    cpu: 0.0
    t4: 2.0
    l4: 5.0
    a100: 12.0
    h100: 20.0
    other: 0.0
  idle_warn_minutes: 20        # idle watchdog threshold on a paid tier

# --- Progress / logging -------------------------------------------------------
progress:
  heartbeat_seconds: 30        # heartbeat() prints elapsed every N seconds

# --- Paths (relative to the working root; see paths.py) ------------------------
paths:
  raw: data/raw
  interim: data/interim
  features: data/features
  models: artifacts/models
  oof: artifacts/oof
  figures: artifacts/figures
  logs: artifacts/logs
  runs: runs
  submission: submission

# --- Canonical raw filenames (data.ingest normalizes suffixed downloads to these) --
canonical_files:
  train_features: train_features.csv
  train_labels: train_labels.csv
  submission_format: submission_format.csv
  submission_format_smoke: submission_format_smoke.csv
  transcripts_zip: train_transcripts.zip
  transcripts_dir: train_transcripts

# --- Self-test / smoke sizing -------------------------------------------------
selftest:
  n_responses: 200
  n_sessions: 50
  max_seconds: 300

# --- Competition-rules boundary (NOT a tuning knob) ---------------------------
# SETTLED by organizer ruling 2026-07-09 (kwetstone):
#   "To make a prediction on any given test sample, the only input to your model drawn
#    from the test should be that sample's metadata and transcript."
#
# Computing a feature by grouping rows of test_features.csv (e.g. counting objectives
# sharing a session_id) VIOLATES the independent-processing rule.
#
# ⛔ DO NOT SET THIS TRUE FOR A SUBMISSION. It exists only so the same features can be
# computed on TRAINING data for research purposes — the "objectives compete for a fixed
# lesson budget" finding is valid there and appears in the paper. Any build with this
# enabled is disqualification-risky, and submission.verify will flag it.
features:
  allow_cross_row_aggregates: false

# --- Embeddings ---------------------------------------------------------------
# Frozen extraction on L4, cached forever. Model must be commercial-use licensed.
embeddings:
  model_name: answerdotai/ModernBERT-base   # Apache-2.0; in runtime via sentence-transformers
  max_tokens: 8192
  batch_size: 32
  cache_version: v1

# --- Tokenizer used for eda.inference_budget token counts ---------------------
tokenizer:
  # tiktoken cl100k_base is a fast, license-clean proxy for "LLM tokens".
  # For encoder budgets we also report the HF tokenizer count in eda.transcripts.
  tiktoken_encoding: cl100k_base

# --- Leaderboard projection ---------------------------------------------------
# Derived in docs/ENDGAME.md §1 and reproduced by scripts/lb_decomposition.py.
#
# For a calibrated model the log loss is  C - k*(AUC-0.5)^2 , where C is the entropy of
# the test base rate plus any centring error, and k was fitted on three of our own OOF
# sets spanning AUC 0.61-0.72 (k = 1.307, 1.324, 1.331).
#
# C is identified exactly by the two shrinkage settings we shipped to the leaderboard
# (w=1.00 -> 0.6106, w=0.55 -> 0.6133), which fit LL(w) = C + G(w^2-2w).
#
# These are ESTIMATES from leaderboard feedback, not held-out measurements. They are used
# to rank candidates on a common scale, never quoted as evidence in the write-up.
leaderboard:
  k: 1.321                     # log-loss gain per unit (AUC-0.5)^2
  c: 0.62393                   # our measured H(base) + centring error
  best_observed_c: 0.62227     # best C on the public table -> bounds H(test base rate)
  our_logloss: 0.6106
  our_auroc: 0.6014
